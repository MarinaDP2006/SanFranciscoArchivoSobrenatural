# Configuración por defecto de la conexión MySQL.
# Puede sobrescribirse con un archivo "archive.properties" junto al .jar
# o con variables de entorno: SFA_DB_URL, SFA_DB_USER, SFA_DB_PASSWORD
db.url=jdbc:mysql://localhost:3306/sf_archive?useUnicode=true&characterEncoding=UTF-8
db.user=sfa_admin
db.password=sfa_admin_2026
db.pool.size=5

# --- API pública (módulo api-web) ---
# La API usa un usuario MySQL con permisos mínimos: leer las vistas públicas
# y registrar solicitudes de ayuda anónimas.
api.db.user=sfa_web
api.db.password=sfa_web_2026
api.port=8080
# Carpeta de la web a servir (opcional). Si existe, http://localhost:8080 muestra la web.
web.dir=../archive-web/public
