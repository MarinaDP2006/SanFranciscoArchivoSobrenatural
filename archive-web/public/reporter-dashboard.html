<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#070b08">
	<title>Panel reporter | San Francisco Archive</title>
	<link rel="stylesheet" href="css/terminal.css">
</head>
<body class="reporter-shell">
	<header class="site-header reporter-header">
		<a class="wordmark" href="index.html">
			<span class="wordmark-mark" aria-hidden="true">SFA</span>
			<span class="wordmark-name">SAN FRANCISCO<br>ARCHIVE</span>
		</a>
		<div class="header-state"><span class="live-dot" aria-hidden="true"></span><span>SESIÓN REPORTER</span></div>
		<span id="reporter-name" class="header-state"></span>
		<button id="logout-button" class="secondary-button" type="button">CERRAR SESIÓN</button>
	</header>

	<main class="reporter-layout">
		<section class="reporter-intro">
			<div>
				<p class="eyebrow">ÁREA PERSONAL <span class="eyebrow-index">/ REPORTER</span></p>
				<h1>Contratos e incidentes</h1>
				<p>Gestiona solicitudes asociadas a tu cuenta.</p>
			</div>
			<a class="text-link" href="index.html">VER FEED PÚBLICO ↗</a>
		</section>

		<div class="reporter-columns">
			<section class="web-panel" aria-labelledby="new-contract-title">
				<h2 id="new-contract-title">NUEVO CONTRATO</h2>
				<form id="contract-form" class="contract-form">
					<label class="field-label" for="incident-id">INCIDENTE PÚBLICO
						<select class="form-control" id="incident-id" name="idIncidente" required>
							<option value="">CARGANDO INCIDENTES...</option>
						</select>
					</label>
					<label class="field-label" for="description">DESCRIPCIÓN DETALLADA
						<textarea class="form-control" id="description" name="descripcionDetallada"
											maxlength="5000" required></textarea>
					</label>
					<div class="form-grid">
						<label class="field-label" for="danger">NIVEL DE PELIGRO
							<select class="form-control" id="danger" name="nivelPeligro" required>
								<option value="1">1 · BAJO</option>
								<option value="2">2</option>
								<option value="3" selected>3 · MEDIO</option>
								<option value="4">4</option>
								<option value="5">5 · CRÍTICO</option>
							</select>
						</label>
						<label class="field-label" for="difficulty">NIVEL DE DIFICULTAD
							<select class="form-control" id="difficulty" name="nivelDificultad" required>
								<option value="1">1 · BAJO</option>
								<option value="2">2</option>
								<option value="3" selected>3 · MEDIO</option>
								<option value="4">4</option>
								<option value="5">5 · CRÍTICO</option>
							</select>
						</label>
					</div>
					<button id="contract-submit" class="primary-button" type="submit">ENVIAR SOLICITUD</button>
					  <output id="contract-status" class="form-status" aria-live="polite"></output>
				</form>
			</section>

			<section class="web-panel" aria-labelledby="contracts-title">
				<h2 id="contracts-title">MIS CONTRATOS</h2>
				<output id="contracts-status" class="form-status" aria-live="polite">CARGANDO REGISTROS...</output>
				<div id="contracts-list" class="contract-list"></div>
			</section>
		</div>
	</main>
	<script type="module" src="js/reporter.js"></script>
</body>
</html>
