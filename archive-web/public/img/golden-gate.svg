    <rect x="380" y="140" width="58" height="8"/><rect x="380" y="200" width="58" height="8"/><rect x="380" y="260" width="58" height="8"/>
    <rect x="860" y="90" width="18" height="300"/><rect x="900" y="90" width="18" height="300"/>
